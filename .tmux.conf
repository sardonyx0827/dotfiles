# shell settings
# シェルは $SHELL に従う。default-shell は default-command が空のときにしか
# 参照されない (tmux 仕様) ため、両方を書くと default-shell 側が黙って死ぬ。
# 以前ここに `set-option -g default-shell /bin/zsh` があったが、直下の
# default-command に一度も効いておらず、読む人に「tmux は必ず zsh で起動する」
# という誤った保証を与えていた。決定を default-command に一本化する。
# 帰結として、$SHELL が zsh でない環境ではペインも zsh にならない。また
# default-command 経由のシェルは非ログインシェルになる (default-shell 経由なら
# ログインシェル)。どちらも変えたい場合はこの 1 行を差し替えること。
set-option -g default-command "${SHELL}"
set -g cursor-style default

# status bar
set-option -g status-bg default
set-option -g status-style bg=default
set-option -g status-left '#[fg=red,bg=colour238]#{?client_prefix,#[reverse],} #[default]'
set-window-option -g window-status-format '#[fg=#6699cc,bg=colour235] #I #[fg=#999999,bg=#2d2d2d] #W #[default]'

# terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# prefix
set -g prefix C-a
## Send the tmux prefix to the pane (useful for nested tmux sessions)
bind C-a send-prefix
## remove default prefix key (C-b)
unbind C-b

# copy-mode
set-window-option -g mode-keys vi
if-shell 'uname | grep -q Linux' {
  ### for Ubuntu
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -ip && xsel -op | xsel -ib"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -ip && xsel -op | xsel -ib"
  bind ] run 'tmux set-buffer -- "$(xsel -b)"; tmux paste-buffer'
} {
  ### for Mac
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind ] run 'tmux set-buffer -- "$(pbpaste)"; tmux paste-buffer'
}

bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi escape send-keys -X clear-selection

# pane
## display pane border indicators
set -g pane-border-indicators both
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=#FFFFFF,bg=default'

## move pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## swap pane (directional, mirrors the h/j/k/l movement keys above)
## swap-pane only offers -U/-D (previous/next in pane order), so target the
## neighbour in each direction explicitly to give all four keys distinct,
## direction-consistent behaviour instead of two -U/-D duplicates.
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

## resize pane
bind C-h resize-pane -L 10
bind C-j resize-pane -D 10
bind C-k resize-pane -U 10
bind C-l resize-pane -R 10

## close pane (other than current)
bind o kill-pane -a

## close pane (current)
bind C-q kill-pane

## sync pane
bind e set-window-option synchronize-panes
## run shell in pane
# 打った文字列をシェルのコマンド文字列へ埋め込まないこと。tmux の `%%` は
# 「応答をそのまま貼り付ける」だけの生置換で、旧実装
# `run-shell "~/.tmux/...sh '%%'"` は貼り付け先がシングルクォートの内側だった。
# そのため二つ壊れていた。(1) `git commit -m 'wip'` と打つとユーザのクォートが
# 黙って剥がれ、各ペインには `git commit -m wip` がバラバラの語として届く。
# (2) `a'; echo INJECTED; '` と打つとクォートが途中で閉じ、`echo INJECTED` が
# tmux サーバのシェルで走る。自作自演とはいえ正真正銘のコマンドインジェクション。
# tmux には prompt の応答をシェル用にクォートする手段が無いので、シェル語に
# 埋め込む限りこの穴は塞げない。そこで応答は tmux のユーザオプションを伝言板に
# して受け渡し、`run-shell` に渡す文字列は定数にした。応答が触れるパーサは
# tmux 自身のものだけになる。受け側は scripts/tmux_send_to_all_except_nvim.sh
# が show-options で読み戻して消す。
# `%%` ではなく `%%%` であること。`%%%` は貼り付ける文字列中の
# `"` `\` `$` `;` `~` の 5 文字をエスケープする版で、ここを `%%` に落とすと
# 今度は tmux のパース層でインジェクションが復活する:
# `x" ; kill-server ; set -g @y "` と打てば引用符が閉じて set-option の引数を
# 抜け、tmux が kill-server を実行してしまう。
#
# この 5 文字であることに依存している。とくに `\` が入っている点が効いていて、
# 「エスケープされるのは引用符だけ」だとこの修正は破れる:
# `\" ; kill-server ; set -g @y "` と打つと `\` が素通りして `\` + `\"` =
# `\\"` になり、tmux 側で `\\` が `\` に戻った後の `"` が引数を閉じてしまう。
# 実際には `\` もエスケープされるので成立しない。
#
# なお man tmux は「%%% is like %% but any quotation marks are escaped」としか
# 書いておらず、実挙動の方が man より強い。5 文字であることは tmux 3.7c の
# cmd_template_replace を逆アセンブルして確認した (quote[] = 22 5c 24 3b 7e)。
# 未文書の挙動に寄りかかっているので、tmux を大きく上げたときや別実装に
# 移ったときはここを再確認すること。tests/test_misc_scripts.py の
# TestTmuxSendToAllExceptNvimBind は `%%%` が使われていることは pin するが、
# tmux 実体のエスケープ挙動そのものを検証するテストはスイートに無い。
bind S command-prompt -p "Send to all except nvim:" 'set-option -g @send_to_all_except_nvim "%%%" ; run-shell "~/.tmux/tmux_send_to_all_except_nvim.sh"'

# window
## create new window with current directory
bind c new-window -c "#{pane_current_path}"

## Start window and pane numbering from 1 (default is 0)
set -g base-index 1
setw -g pane-base-index 1

## split window
bind C-s split-window -c "#{pane_current_path}"
### tmux の -h は「横に並べる = 縦の仕切り」。キーは h ではなく v を採る:
### h は上の `bind h select-pane -L` で使用済みで、見た目の仕切りが縦なので
### v(vertical divider) の方が C-s(水平の仕切り) と対で覚えやすい。
bind C-v split-window -h -c "#{pane_current_path}"

### split pane with double-click inside pane
set -g mouse on
bind -n DoubleClick1Pane run-shell -b '\
  x=#{mouse_x}; y=#{mouse_y}; w=#{pane_width}; h=#{pane_height}; \
  pane_id="#{pane_id}"; \
  if [ $((w - x)) -le 5 ]; then \
    tmux split-window -h -t "$pane_id"; \
  elif [ $((h - y)) -le 5 ]; then \
    tmux split-window -v -t "$pane_id"; \
  else \
    tmux copy-mode -t "$pane_id"; tmux send-keys -X select-word; \
  fi'

## development
bind N new-window -n 'dev' -c "#{pane_current_path}" \; \
  send-keys 'claude' C-m \;

bind C-c split-window -h -c "#{pane_current_path}" \; \
  resize-pane -x 30% \; \
  send-keys 'claude' C-m \;

# logging
## C-a C-p Start logging.
# mkdir -p は必須。このバインドは tmux-logging プラグインのスクリプトを呼ばず
# pipe-pane を直接展開しているので、プラグイン側の mkdir の恩恵を受けない。
# install.sh が作るのは ~/.tmux までで ~/.tmux/log は作らないため、導入直後の
# マシンではリダイレクトが "No such file or directory" で落ちる。しかも
# `\; display-message "Logging start."` は無条件に繋がっているので、何も記録
# されていないのに「開始しました」と表示される。プラグイン自身の M-p/M-P を
# 一度でも押すと同じディレクトリが作られて症状が消えるため、使い込んだ
# マシンでは再現しない。
bind C-p pipe-pane -o '/bin/sh -c "mkdir -p \${HOME}/.tmux/log; LOG=\${HOME}/.tmux/log/\$(date +%Y%m%d-%H%M%S)-#S-#I.#P.log; while read -r LINE; do echo \"[\$(date +\"%Y_%m%d_%H%M%S_%N\")] \${LINE}\" >> \${LOG}; done "' \; display-message "Logging start."
## C-a C-o Stop logging
bind C-o pipe-pane \; display-message "Logging end."

# plugins
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @logging-path '~/.tmux/log'
set -g @save-complete-history-path '~/.tmux/log'
set -g @screen-capture-path '~/.tmux/log'
# prefix+f で easy-motion を起動する。tpm は resize バインド (bind C-j, 上部)
# より後に読み込まれるため、C-j にすると easy-motion が resize-pane -D を
# 上書きして下方向リサイズが死ぬ。f は他で未使用なので衝突しない。
set -g @easy-motion-prefix "f"
set -g @easy-motion-default-motion "bd-w"

set -g @rose_pine_variant 'moon'
set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator}'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
