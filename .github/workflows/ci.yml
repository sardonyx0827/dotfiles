name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小権限: このワークフローはチェックアウトして検査するだけ
permissions:
  contents: read

# 同一 ref の古い実行はキャンセル。ただし main への push は
# 途中中断しない（開発ブランチの実行は最後まで通す）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    # 単一 OS (ubuntu) は意図的な選択。フックと install.sh は hermetic テストで、
    # OS 依存分岐は差し込み口 (例: DEBIAN_VERSION_FILE、OS 変数を強制する sourced
    # 関数テスト) 経由で host 非依存に検証している。macOS/Windows ランナーを足しても
    # 追加で得られる実カバレッジは小さく CI コスト/保守負荷に見合わないため採用せず、
    # macOS 実機での確認は手元の実行に委ねる。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Python バージョン非依存のステップ (zsh 導入・生成物チェック・ファイル別
      # カバレッジ床) を担当する代表レッグ。両レッグで走らせても追加のシグナルが
      # 無いのに CI 時間と外部ネットワーク依存 (apt) だけ倍増するため 1 本に
      # 集約する。matrix を更新するときはここも合わせて更新すること。
      PRIMARY_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # requirements ファイルは無いので、pip のバージョンピンを記述している
          # このワークフロー自体をキャッシュキーにする
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "pytest==9.0.1" "pytest-cov==7.0.0"
      # .zshrc の構文検査 (zsh -n) に必要。未導入なら該当テストは skip される。
      # zsh の検査対象は Python バージョンと無関係なので代表レッグにだけ導入し、
      # もう一方のレッグでは該当テストの skip を許容する (apt-get はキャッシュの
      # 無い外部ネットワーク依存 = 失敗点なので、無駄に 2 回走らせない)
      - name: Install zsh
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: sudo apt-get update && sudo apt-get install -y zsh
      # フックは stdin/subprocess/urlopen を全てスタブ化した hermetic テスト。
      # codex / gemini / tmux 等の実バイナリは不要（conftest.py 参照）。
      # Python フックは in-process で exec されるためカバレッジを実測でき、
      # 集計 90% を下回るとジョブが失敗する（設定は .coveragerc、実測は約 97%）。
      # 併せて JSON レポートを出力し、後続ステップでファイル単位の床も強制する。
      - name: Run pytest (with coverage gate)
        run: >-
          python -m pytest -q
          --cov=.claude/hooks
          --cov=.claude/mcp-servers
          --cov=.codex/hooks
          --cov=scripts
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=90
      # .codex/agents/*.toml は .claude/agents/*.md から生成される成果物であり、
      # Codex CLI がビルド無しで読むためリポジトリにコミットしてある。手動編集や
      # SSOT 側だけの更新を弾く。生成器自身の --check を使うのは、`git diff` が
      # 未追跡ファイルや孤児 TOML を見逃すため（tests 側でも同じ検査をするが、
      # ここで独立に落とすことで失敗理由が CI ログ上で明示される）。
      # 生成物の一致検査は Python バージョン非依存なので代表レッグでのみ実行。
      - name: Check generated Codex agents are current
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: python3 scripts/gen_codex_agents.py --check
      # 集計 90% ゲートはファイル単位の低カバレッジを平均で覆い隠すため、
      # 各ファイルに最低 80% を別途強制する（測定された全ファイルが対象。
      # 以前あった .coveragerc の omit は、対象だった .codex 側の
      # _bash_review_common.py の複製が撤去され、共有モジュールが実体 1 本
      # だけになったため不要になった。詳細は .coveragerc のコメント参照）。
      # 床チェックは代表レッグでのみ実行する: レッグ間でファイル別プロファイルは
      # ほぼ同一で、もう一方のレッグにも集計 90% ゲートは残っているため、
      # 2 回目の床チェックが追加で検出できるものは実質無い。
      - name: Enforce per-file coverage floor (80%)
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: |
          python - <<'PY'
          import json
          import sys

          FLOOR = 80.0
          with open("coverage.json", encoding="utf-8") as fh:
              data = json.load(fh)

          failures = []
          for path, meta in sorted(data["files"].items()):
              pct = meta["summary"]["percent_covered"]
              print(f"{'OK ' if pct >= FLOOR else 'LOW'} {pct:6.2f}%  {path}")
              if pct < FLOOR:
                  failures.append((path, pct))

          if failures:
              print()
              for path, pct in failures:
                  print(f"::error::{path} coverage {pct:.2f}% is below the {FLOOR:.0f}% floor")
              sys.exit(1)

          print(f"\nAll measured files meet the {FLOOR:.0f}% per-file floor.")
          PY
      # install.sh (約 1600 行) は pytest のカバレッジ計測外 — 上のゲートは
      # Python フック群だけを測る。source した関数単位テスト (test_install.py)
      # は個々の分岐を hermetic に押さえるが、main() を通した end-to-end の配線
      # (detect_os → create_symlinks → backup_if_real → _render_git_local_config
      # → link_* → change_shell プレビュー) は一度も実行されていなかった。
      # --dry-run はパッケージ導入を announce-and-skip し、ネットワーク/sudo/apt を
      # 一切触らず FS も書かない (DRY_RUN ガード) ため、ubuntu ランナー上でそのまま
      # 通せる無償のスモークになる。完了行を grep して、将来 main() が途中で
      # return 0 する退行 (スモークが素通りする) も検出する。OS 非依存なので代表
      # レッグでのみ実行する。
      - name: Smoke-test install.sh --dry-run
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: |
          ./install.sh --dry-run | tee install-dryrun.log
          grep -q "Dry-run complete. No changes were made." install-dryrun.log

  lint:
    name: ruff + bandit + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install linters
        run: python -m pip install --upgrade pip "ruff==0.15.6" "bandit==1.9.4" "mypy==1.19.1"
      # スコープは自作 Python のみ（.codex/skills/.system 配下の vendored スクリプトは除外）
      - name: ruff check
        run: ruff check .claude/hooks .claude/mcp-servers tests .codex/hooks scripts
      - name: ruff format --check
        run: ruff format --check .claude/hooks .claude/mcp-servers tests .codex/hooks scripts
      - name: bandit (security, medium+ severity)
        run: bandit -ll -q -r .claude/hooks .claude/mcp-servers tests .codex/hooks scripts
      # フックには元から型注釈が付いていたが検証する仕組みが無く、実装と注釈が
      # 無言で乖離し得た。設定ファイルは置かない: 既定値で緑になり、唯一の例外
      # (Windows 専用の任意依存 win10toast) は import 箇所の inline ignore で
      # 完結するため。設定を足すのは、それが実際に何かを検出するときだけにする。
      # 2 回に分けるのは .claude/hooks と .codex/hooks が同名の bash-review.py を
      # 持ち、両方を 1 回の呼び出しに渡すと mypy が重複モジュールとして実行を
      # 拒否するため。codex 側の bash-review.py は別実体 (exit-2 変種) なので
      # 除外ではなく個別に検査する。
      # codex 側には MYPYPATH が要る: 共有モジュールの実体は .claude/hooks 側に
      # しか無く、.codex/hooks/bash-review.py の sys.path.insert は実行時の操作
      # なので mypy は追えない (共有ファイルが .codex/hooks に symlink として
      # 置かれていた頃は隣接ファイルとして解決できていた)。MYPYPATH は実行時の
      # sys.path と同じ場所を指すので、import を無視するのではなく実体に対して
      # 型検査される。
      # tests/ は対象外: conftest / フック本体を sys.path 操作で読むため mypy の
      # モジュール解決と噛み合わず、緑にするには実挙動と無関係なスタブ整備が
      # 要る。守れない厳しさを掲げるより、本番コードを確実に縛る方を採る。
      - name: mypy (type check)
        run: |
          mypy .claude/hooks .claude/mcp-servers scripts
          MYPYPATH=.claude/hooks mypy .codex/hooks

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # shellcheck は ubuntu-latest ランナーにプリインストール済み
      - name: Run shellcheck
        run: |
          shellcheck --version
          # 自作シェルスクリプトのみ検査（vendored な .codex/skills/.system 配下は除外）
          files=$(git ls-files '*.sh' | grep -v '^\.codex/skills/\.system/')
          echo "$files"
          # -x: source 先を追って検査する。フックは _hook_common.sh 等を sibling
          # として読み込むため、無いと SC1091 (Not following) で落ちる。
          # -P SCRIPTDIR: source 先をスクリプト自身のディレクトリ基準で探す
          # （実行時の cwd に依存させない）。
          # shellcheck disable=SC2086  # パスに空白は無いため意図的に単語分割する
          shellcheck -x -P SCRIPTDIR $files

  # Neovim Lua ツリーの静的解析。これまで .config/nvim/*.lua は CI の外にあり、
  # lazy.lua のコメントが記録する「未定義グローバル参照でエディタが静かに壊れた」
  # クラスの退行を検知できなかった。stylua による整形強制は日常的な手調整と衝突
  # するため意図的に入れず、luacheck を lint 専用で回して当該バグクラスだけを拾う。
  #
  # 助言的 (continue-on-error) から gating へ格上げした。Lua ツリーは約 4,500 行
  # あってこのリポジトリ最大の未検証面であり、テストも無いので luacheck だけが
  # 唯一の自動検査になる。非ブロックのままでは「赤くならない警告」を誰も読まず、
  # 検知できても退行を止められない。格上げの前提として、直近の main で
  # 0 warnings / 0 errors in 50 files を確認済み。
  #
  # gating にしたので版をピン留めする: 助言的だった頃は「誤ピンで恒常的に赤く
  # しない」ことを優先して未固定だったが、ブロックする以上は luacheck の新版が
  # 出た瞬間に無関係な指摘で main が止まる方が困る。luarocks 自体は apt 由来で
  # 未固定のままなので、これは完全な再現性ではなく「検査ツールの固定」である。
  # apt/luarocks の外部ネットワーク依存が失敗点になる点は gating な test ジョブが
  # 既に apt-get install zsh で負っている露出と同じで、新たに増やしてはいない。
  # 設定は .config/nvim/.luacheckrc (LuaJIT + vim グローバル。.luarc.json と一致)。
  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0
      - name: Run luacheck (Neovim Lua tree)
        run: |
          luacheck --version
          luacheck --codes --config .config/nvim/.luacheckrc .config/nvim
